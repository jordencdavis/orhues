<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" fill="none">
  <defs>
    <!-- Sunlit Metallic Gold Gradient -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C4" />
      <stop offset="28%" stop-color="#F1C966" />
      <stop offset="65%" stop-color="#D19A30" />
      <stop offset="100%" stop-color="#8F5C10" />
    </linearGradient>

    <!-- Burnished Shaded Gold Gradient -->
    <linearGradient id="goldShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4B550" />
      <stop offset="45%" stop-color="#B67E1E" />
      <stop offset="85%" stop-color="#7B4E0A" />
      <stop offset="100%" stop-color="#523104" />
    </linearGradient>

    <!-- 3D Beveled Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3BC" />
      <stop offset="22%" stop-color="#E9BE58" />
      <stop offset="48%" stop-color="#A66E18" />
      <stop offset="54%" stop-color="#784B08" />
      <stop offset="78%" stop-color="#E2B44D" />
      <stop offset="100%" stop-color="#6A4007" />
    </linearGradient>

    <!-- Gold Rim Highlight -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF7D4" />
      <stop offset="50%" stop-color="#D8A63D" />
      <stop offset="100%" stop-color="#7C4E0B" />
    </linearGradient>

    <!-- 3D Glossy Crimson Stigma Bead -->
    <radialGradient id="crimsonBead" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF9494" />
      <stop offset="22%" stop-color="#E62222" />
      <stop offset="65%" stop-color="#9E0B0B" />
      <stop offset="100%" stop-color="#4A0202" />
    </radialGradient>

    <!-- Red Stigma Stalk Gradient -->
    <linearGradient id="crimsonStalk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D91C1C" />
      <stop offset="60%" stop-color="#9B0E0E" />
      <stop offset="100%" stop-color="#5C0606" />
    </linearGradient>

    <!-- Soft 3D Emboss Drop Shadow -->
    <filter id="goldShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#3A2204" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- ==================== TOP GOLDEN SAFFRON BLOSSOM ==================== -->
  <g filter="url(#goldShadow)">
    <!-- Outer Left Petal (Split Facets) -->
    <path d="M296 226 C242 208 192 174 162 132 C206 138 254 168 296 226 Z" fill="url(#goldShade)" />
    <path d="M296 226 C236 218 184 182 162 132 C202 158 250 192 296 226 Z" fill="url(#goldBright)" />
    <path d="M296 226 C242 208 192 174 162 132 C184 182 236 218 296 226 Z" stroke="url(#goldRim)" stroke-width="1.2" />

    <!-- Outer Right Petal (Split Facets) -->
    <path d="M304 226 C358 208 408 174 438 132 C394 138 346 168 304 226 Z" fill="url(#goldBright)" />
    <path d="M304 226 C364 218 416 182 438 132 C398 158 350 192 304 226 Z" fill="url(#goldShade)" />
    <path d="M304 226 C358 208 408 174 438 132 C416 182 364 218 304 226 Z" stroke="url(#goldRim)" stroke-width="1.2" />

    <!-- Mid Left Petal (Split Facets) -->
    <path d="M298 224 C264 176 234 124 210 74 C254 94 282 146 298 224 Z" fill="url(#goldShade)" />
    <path d="M298 224 C244 190 212 136 210 74 C242 120 272 170 298 224 Z" fill="url(#goldBright)" />
    <path d="M298 224 C244 190 212 136 210 74 C254 94 282 146 298 224 Z" stroke="url(#goldRim)" stroke-width="1.3" />

    <!-- Mid Right Petal (Split Facets) -->
    <path d="M302 224 C336 176 366 124 390 74 C346 94 318 146 302 224 Z" fill="url(#goldBright)" />
    <path d="M302 224 C356 190 388 136 390 74 C358 120 328 170 302 224 Z" fill="url(#goldShade)" />
    <path d="M302 224 C356 190 388 136 390 74 C346 94 318 146 302 224 Z" stroke="url(#goldRim)" stroke-width="1.3" />

    <!-- Center Tall Upright Petal (Split Left Bright / Right Burnished) -->
    <path d="M300 224 C264 156 266 74 300 18 L300 224 Z" fill="url(#goldBright)" />
    <path d="M300 224 C336 156 334 74 300 18 L300 224 Z" fill="url(#goldShade)" />
    <path d="M300 224 C264 156 266 74 300 18 C334 74 336 156 300 224 Z" stroke="url(#goldRim)" stroke-width="1.5" />
    <line x1="300" y1="18" x2="300" y2="224" stroke="#FCE79C" stroke-width="1" opacity="0.7" />

    <!-- Lower Calyx Curved Gold Scrolls -->
    <path d="M296 232 C278 210 254 198 228 198 C252 206 274 218 296 236 Z" fill="url(#goldBright)" stroke="url(#goldRim)" stroke-width="0.9" />
    <path d="M304 232 C322 210 346 198 372 198 C348 206 326 218 304 236 Z" fill="url(#goldShade)" stroke="url(#goldRim)" stroke-width="0.9" />

    <!-- 3 Red Saffron Stigmas (Filaments + Glossy Spheres) -->
    <path d="M300 232 C296 186 290 148 283 114" stroke="url(#crimsonStalk)" stroke-width="4.2" stroke-linecap="round" />
    <path d="M300 234 L300 96" stroke="url(#crimsonStalk)" stroke-width="4.6" stroke-linecap="round" />
    <path d="M300 232 C304 186 310 148 317 114" stroke="url(#crimsonStalk)" stroke-width="4.2" stroke-linecap="round" />

    <!-- Left Stigma Bead -->
    <circle cx="283" cy="112" r="10.5" fill="url(#crimsonBead)" />
    <circle cx="280" cy="108.5" r="2.6" fill="#FFD1D1" opacity="0.85" />

    <!-- Center Stigma Bead -->
    <circle cx="300" cy="93" r="11.5" fill="url(#crimsonBead)" />
    <circle cx="296.5" cy="89" r="3" fill="#FFD1D1" opacity="0.9" />

    <!-- Right Stigma Bead -->
    <circle cx="317" cy="112" r="10.5" fill="url(#crimsonBead)" />
    <circle cx="314" cy="108.5" r="2.6" fill="#FFD1D1" opacity="0.85" />
  </g>

  <!-- ==================== 3D METALLIC GOLD "ORHUES" ==================== -->
  <g filter="url(#goldShadow)">
    <text
      x="300"
      y="326"
      text-anchor="middle"
      font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif"
      font-size="108"
      font-weight="700"
      letter-spacing="6"
      fill="url(#goldText)"
      stroke="url(#goldRim)"
      stroke-width="1.5"
    >
      ORHUES
    </text>
  </g>

  <!-- ==================== SUBTITLE "RARE. REDEFINED. REVERED." ==================== -->
  <text
    x="300"
    y="366"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif"
    font-size="22"
    font-weight="700"
    letter-spacing="5.5"
    fill="#1E1812"
  >
    RARE. REDEFINED. REVERED.
  </text>

  <!-- ==================== BOTTOM ORNAMENTAL FILIGREE ==================== -->
  <g filter="url(#goldShadow)" stroke="url(#goldBright)" fill="none">
    <!-- Left & Right Tapered Horizontal Needles -->
    <path d="M72 398 L244 396.5 L244 399.5 Z" fill="url(#goldBright)" stroke="none" />
    <path d="M528 398 L356 396.5 L356 399.5 Z" fill="url(#goldBright)" stroke="none" />

    <!-- Left & Right Leaf Loops -->
    <path d="M244 398 C252 389 270 389 278 398 C270 407 252 407 244 398 Z" stroke-width="2.2" fill="none" />
    <path d="M254 398 L268 394 M254 398 L268 402" stroke-width="1.5" stroke-linecap="round" />

    <path d="M356 398 C348 389 330 389 322 398 C330 407 348 407 356 398 Z" stroke-width="2.2" fill="none" />
    <path d="M346 398 L332 394 M346 398 L332 402" stroke-width="1.5" stroke-linecap="round" />

    <!-- Center 4-Diamond Lattice Knot -->
    <polygon points="300,378 310,388 300,398 290,388" stroke-width="2.2" fill="none" />
    <polygon points="300,398 310,408 300,418 290,408" stroke-width="2.2" fill="none" />
    <polygon points="290,388 300,398 290,408 280,398" stroke-width="2.2" fill="none" />
    <polygon points="310,388 320,398 310,408 300,398" stroke-width="2.2" fill="none" />
    <circle cx="300" cy="388" r="1.8" fill="#FCE79C" stroke="none" />
    <circle cx="300" cy="408" r="1.8" fill="#FCE79C" stroke="none" />
    <circle cx="290" cy="398" r="1.8" fill="#FCE79C" stroke="none" />
    <circle cx="310" cy="398" r="1.8" fill="#FCE79C" stroke="none" />
  </g>
</svg>
